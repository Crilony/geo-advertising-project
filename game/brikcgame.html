<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Арканоид — шарик, бита и кирпичи</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            border-radius: 32px;
            background: rgba(10, 20, 30, 0.6);
            backdrop-filter: blur(2px);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5), inset 0 0 2px rgba(255,255,255,0.1);
            cursor: none;
            background-color: #03060c;
        }

        .info-panel {
            margin-top: 20px;
            display: flex;
            gap: 32px;
            background: #11161fcc;
            backdrop-filter: blur(8px);
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: bold;
            color: #f2e8cf;
            text-shadow: 0 1px 2px black;
            border: 1px solid #ffcf9a30;
        }

        .score-box, .lives-box {
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: #00000066;
            padding: 4px 18px;
            border-radius: 40px;
            font-family: monospace;
        }

        .score-box span, .lives-box span {
            color: #ffd966;
            font-weight: 800;
        }

        .restart-btn {
            background: #2a3b4c;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 50px;
            color: #ffecb3;
            cursor: pointer;
            font-family: monospace;
            transition: 0.2s;
            margin-left: 20px;
            box-shadow: 0 3px 0 #0f1a22;
        }

        .restart-btn:hover {
            background: #3f556b;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #0f1a22;
        }

        .status {
            background: #000000aa;
            padding: 4px 18px;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: bold;
            color: #ffd966;
        }

        @media (max-width: 780px) {
            .score-box, .lives-box { font-size: 1.2rem; padding: 2px 12px; }
            .info-panel { gap: 15px; padding: 6px 18px; }
            .restart-btn { padding: 3px 16px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="650"></canvas>
        <div class="info-panel">
            <div class="score-box">🏆 СЧЕТ: <span id="scoreValue">0</span></div>
            <div class="lives-box">💚 ЖИЗНИ: <span id="livesValue">3</span></div>
            <button class="restart-btn" id="restartButton">🔄 НОВАЯ ИГРА</button>
        </div>
        <div class="status" id="gameStatusText">🎮 двигай мышью → зеленая бита</div>
    </div>
</div>

<script>
    (function(){
        // ---------- НАСТРОЙКИ ПОЛОТНА ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Размеры игры
        let canvasW = 900;
        let canvasH = 650;
        canvas.width = canvasW;
        canvas.height = canvasH;

        // ---------- ПАРАМЕТРЫ БИТЫ (зеленая) ----------
        const PADDLE_WIDTH = 120;
        const PADDLE_HEIGHT = 18;
        let paddleX = (canvasW - PADDLE_WIDTH) / 2;
        const paddleY = canvasH - PADDLE_HEIGHT - 12;  // отступ снизу 12px

        // ---------- ШАРИК (желтый) ----------
        let ball = {
            x: canvasW/2,
            y: paddleY - 12,
            radius: 9,
            dx: 2.8,
            dy: -3.2,
            speed: 4.2
        };

        // ---------- КИРПИЧИ (розовые) ----------
        // Строки кирпичей будут динамически надвигаться сверху (создаем массив полос)
        // Каждый кирпич: { x, y, w, h, status }
        let bricks = [];
        // Размеры кирпичей
        const BRICK_W = 72;
        const BRICK_H = 24;
        const BRICKS_PER_ROW = Math.floor(canvasW / BRICK_W);   // 900/72 ≈ 12.5 → 12 кирпичей в ряду
        const COLS = BRICKS_PER_ROW;   // 12 кирпичей
        // Отступы по горизонтали, чтобы выглядело ровно
        const brickOffsetX = (canvasW - (COLS * BRICK_W)) / 2;
        let rowsToGenerate = 5;         // начальное количество рядов
        let currentTopY = 45;           // стартовая позиция первого ряда (немного ниже верха)
        
        // Глобальная скорость движения полос кирпичей вниз (пикселей в секунду, но по кадрам)
        let bricksSpeedY = 0.75;         // плавное надвигание сверху
        // Для плавного движения накапливаем смещение
        let brickWaveOffset = 0;          // не используется, просто движение по кадрам
        
        // Счет и жизни
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let animationId = null;
        
        // Флаги для управления мышкой
        let isMouseInside = true;
        
        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function initBricks() {
            bricks = [];
            // rowsToGenerate = 5 - можно увеличить по сложности, но пусть 5 рядов сверху
            // Но чтобы надвигались, будем размещать ряды начиная с currentTopY, но при старте зададим currentTopY = 40
            for(let row = 0; row < rowsToGenerate; row++) {
                let brickY = currentTopY + (row * BRICK_H) + (row * 2); // небольшой вертикальный зазор 2px
                for(let col = 0; col < COLS; col++) {
                    let brickX = brickOffsetX + (col * BRICK_W);
                    bricks.push({
                        x: brickX,
                        y: brickY,
                        w: BRICK_W,
                        h: BRICK_H,
                        status: 1,   // 1 - активен, 0 - уничтожен
                    });
                }
            }
        }
        
        // Пересоздание игры (сброс)
        function resetGame() {
            gameRunning = true;
            score = 0;
            lives = 3;
            updateScoreUI();
            updateLivesUI();
            document.getElementById('gameStatusText').innerHTML = "🎮 игра активна!";
            
            // Сброс биты
            paddleX = (canvasW - PADDLE_WIDTH) / 2;
            
            // Сброс шарика
            ball.x = canvasW/2;
            ball.y = paddleY - 14;
            ball.dx = 2.8 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -3.2;
            ball.speed = 4.2;
            
            // Сброс кирпичей: верхняя граница полос заново
            currentTopY = 45;
            rowsToGenerate = 5;
            initBricks();   // построим кирпичи на позициях с currentTopY
            // анимация продолжается
        }
        
        // Обновление UI
        function updateScoreUI() {
            document.getElementById('scoreValue').innerText = score;
        }
        function updateLivesUI() {
            document.getElementById('livesValue').innerText = lives;
        }
        
        // Движение мыши (управление битой)
        function handleMouseMove(e) {
            if(!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let mouseX = (e.clientX - rect.left) * scaleX;
            mouseX = Math.min(Math.max(mouseX, 0), canvasW - PADDLE_WIDTH);
            paddleX = mouseX;
        }
        
        // также для touch, если на мобильном (доп опционально)
        function handleTouchMove(e) {
            e.preventDefault();
            if(!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            let touchX = (touch.clientX - rect.left) * scaleX;
            touchX = Math.min(Math.max(touchX, 0), canvasW - PADDLE_WIDTH);
            paddleX = touchX;
        }
        
        // ----- ЛОГИКА СТОЛКНОВЕНИЙ С КИРПИЧАМИ -----
        function handleBallBrickCollision() {
            let anyBrickHit = false;
            for(let i = 0; i < bricks.length; i++) {
                const b = bricks[i];
                if(b.status === 0) continue;
                
                // Границы кирпича
                let left = b.x;
                let right = b.x + b.w;
                let top = b.y;
                let bottom = b.y + b.h;
                
                // Шарик
                let ballLeft = ball.x - ball.radius;
                let ballRight = ball.x + ball.radius;
                let ballTop = ball.y - ball.radius;
                let ballBottom = ball.y + ball.radius;
                
                if(ballRight > left && ballLeft < right && ballBottom > top && ballTop < bottom) {
                    // пересечение! Уничтожаем кирпич и меняем направление
                    anyBrickHit = true;
                    b.status = 0;
                    score += 10;
                    updateScoreUI();
                    
                    // Определяем сторону столкновения (грубо, но классически)
                    let overlapLeft = (ballRight - left);
                    let overlapRight = (right - ballLeft);
                    let overlapTop = (ballBottom - top);
                    let overlapBottom = (bottom - ballTop);
                    
                    let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                    if(minOverlap === overlapTop || minOverlap === overlapBottom) {
                        // отскок по вертикали
                        ball.dy = -ball.dy;
                    } else {
                        // отскок по горизонтали
                        ball.dx = -ball.dx;
                    }
                    
                    // Небольшой сдвиг, чтобы избежать застревания
                    ball.x += (ball.dx > 0 ? 1 : -1) * 2;
                    ball.y += (ball.dy > 0 ? 1 : -1) * 2;
                    break; // за один кадр обрабатываем только одно столкновение с кирпичом (во избежание багов)
                }
            }
            return anyBrickHit;
        }
        
        // движение кирпичей вниз (надвигание полосой)
        function moveBricksDown() {
            // надвигаем все кирпичи на bricksSpeedY пикселей вниз
            let needNewRow = false;
            for(let b of bricks) {
                if(b.status === 1) {
                    b.y += bricksSpeedY;
                }
            }
            // Проверка: если самый нижний активный кирпич достиг уровня биты или превышает опасную зону (ниже paddleY - 40)
            // а также, если верхние ряды сильно опустились, добавим новые кирпичи сверху.
            // Условие "надвигаются полосой" означает, что постоянно появляются новые ряды сверху.
            // найдем минимальную Y среди активных кирпичей
            let minActiveY = Infinity;
            let maxActiveY = -Infinity;
            for(let b of bricks) {
                if(b.status === 1) {
                    if(b.y < minActiveY) minActiveY = b.y;
                    if(b.y + b.h > maxActiveY) maxActiveY = b.y + b.h;
                }
            }
            // Если верхняя граница самого верхнего кирпича стала ниже 30px, то добавляем сверху новый ряд
            // чтобы было постоянное наступление
            if(minActiveY > 35 && bricks.length > 0) {
                // Добавляем новый ряд сверху (не слишком часто, но каждый раз когда ряд сместился вниз)
                // нужно чтобы сверху образовывалась новая линия розовых кирпичей.
                let newRowY = minActiveY - BRICK_H - 3;
                // ограничение: новый ряд не выше 15px
                if(newRowY < 12) newRowY = 12;
                // добавим ряд, если нет уже кирпичей слишком близко
                let tooClose = false;
                for(let b of bricks) {
                    if(b.status === 1 && Math.abs(b.y - newRowY) < BRICK_H-5) {
                        tooClose = true;
                        break;
                    }
                }
                if(!tooClose && newRowY >= 10) {
                    for(let col = 0; col < COLS; col++) {
                        let brickX = brickOffsetX + (col * BRICK_W);
                        bricks.push({
                            x: brickX,
                            y: newRowY,
                            w: BRICK_W,
                            h: BRICK_H,
                            status: 1,
                        });
                    }
                }
            }
            
            // Опасно: если какой-то кирпич достиг уровня биты (y + h > paddleY + 5), то проигрыш жизни
            for(let i=0; i<bricks.length; i++) {
                let b = bricks[i];
                if(b.status === 1 && (b.y + b.h) >= paddleY - 2) {
                    // кирпичи задели биту → теряем жизнь
                    if(gameRunning) {
                        loseLife("Кирпичи достигли низа!");
                    }
                    return true; // сигнал, что была потеря жизни
                }
            }
            return false;
        }
        
        // функция потери жизни
        function loseLife(reason) {
            if(!gameRunning) return;
            lives--;
            updateLivesUI();
            if(lives <= 0) {
                gameRunning = false;
                document.getElementById('gameStatusText').innerHTML = "💀 ИГРА ОКОНЧЕНА. Нажмите Новая игра 💀";
                return;
            }
            // перезапуск позиции шарика и биты (мяч теряется, ставим на биту)
            ball.x = paddleX + PADDLE_WIDTH/2;
            ball.y = paddleY - 15;
            ball.dx = 2.8 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -3.2;
            // жизни уменьшились, но игра продолжается
            document.getElementById('gameStatusText').innerHTML = `⚠️ потеряна жизнь! осталось ${lives} ⚠️`;
            setTimeout(() => {
                if(gameRunning) document.getElementById('gameStatusText').innerHTML = "🎮 играем, отбивай шарик!";
            }, 1500);
        }
        
        // Основное обновление игры (движение, коллизии)
        function updateGame() {
            if(!gameRunning) return;
            
            // 1. Движение шарика
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 2. Столкновение со стенами (лево, право, верх)
            if(ball.x + ball.radius > canvasW) {
                ball.x = canvasW - ball.radius;
                ball.dx = -ball.dx;
            } else if(ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.dx = -ball.dx;
            }
            if(ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.dy = -ball.dy;
            }
            
            // 3. Столкновение с битой (зеленой)
            if(ball.y + ball.radius >= paddleY && ball.y - ball.radius <= paddleY + PADDLE_HEIGHT &&
               ball.x + ball.radius > paddleX && ball.x - ball.radius < paddleX + PADDLE_WIDTH) {
                // отскок с изменением угла в зависимости от места удара
                let hitPos = (ball.x - paddleX) / PADDLE_WIDTH;
                let angle = (hitPos - 0.5) * 1.2;  // от -0.6 до 0.6 рад
                let newDx = Math.sin(angle) * ball.speed;
                let newDy = -Math.cos(angle) * ball.speed;
                // нормализация скорости
                let spd = Math.hypot(newDx, newDy);
                if(spd > 0.001) {
                    ball.dx = (newDx / spd) * ball.speed;
                    ball.dy = (newDy / spd) * ball.speed;
                } else {
                    ball.dy = -ball.speed;
                    ball.dx = (ball.dx > 0 ? ball.speed*0.7 : -ball.speed*0.7);
                }
                // небольшой сдвиг, чтобы не залипало
                ball.y = paddleY - ball.radius - 1;
            }
            
            // 4. Проверка падения шарика ниже биты (потеря жизни)
            if(ball.y + ball.radius >= canvasH) {
                if(gameRunning) {
                    loseLife("Шарик упал вниз!");
                }
                // после потери жизни, если игра еще активна, шарик переставляется
                if(gameRunning && lives > 0) {
                    ball.x = paddleX + PADDLE_WIDTH/2;
                    ball.y = paddleY - 15;
                    ball.dx = 2.8 * (Math.random() > 0.5 ? 1 : -1);
                    ball.dy = -3.2;
                } else if(lives <= 0) {
                    gameRunning = false;
                    document.getElementById('gameStatusText').innerHTML = "💀 GAME OVER 💀";
                }
                return;
            }
            
            // 5. Столкновение с кирпичами
            handleBallBrickCollision();
            
            // 6. Движение кирпичей вниз (надвигание полосой)
            let brickHitBottom = moveBricksDown();
            if(brickHitBottom && gameRunning && lives <= 0) {
                gameRunning = false;
            }
            
            // 7. Проверка победы - если все кирпичи уничтожены (status 0)
            let anyAlive = bricks.some(b => b.status === 1);
            if(!anyAlive && bricks.length > 0) {
                // победа: генерируем новую волну (усложнение)
                if(gameRunning) {
                    rowsToGenerate = Math.min(rowsToGenerate + 1, 9);
                    bricksSpeedY += 0.12;
                    // сбрасываем позиции: поднимаем текущие кирпичи выше? но их нет, создаем новые сверху
                    currentTopY = 35;
                    initBricks();
                    score += 200;
                    updateScoreUI();
                    document.getElementById('gameStatusText').innerHTML = "✨ ВОЛНА КИРПИЧЕЙ! УСЛОЖНЕНИЕ ✨";
                    setTimeout(() => {
                        if(gameRunning) document.getElementById('gameStatusText').innerHTML = "🎯 отбивай, надвигаются розовые блоки!";
                    }, 1800);
                }
            }
            
            // дополнительно: если жизнь 0 выключаем флаги
            if(lives <= 0) gameRunning = false;
        }
        
        // ----- ОТРИСОВКА ВСЕГО -----
        function draw() {
            ctx.clearRect(0, 0, canvasW, canvasH);
            
            // Фон с сеткой (стиль)
            ctx.fillStyle = "#071126";
            ctx.fillRect(0, 0, canvasW, canvasH);
            for(let i=0; i<canvasW; i+=40) {
                ctx.beginPath();
                ctx.strokeStyle = "#1e334f";
                ctx.lineWidth = 0.5;
                ctx.moveTo(i,0);
                ctx.lineTo(i,canvasH);
                ctx.stroke();
                ctx.moveTo(0,i%canvasH);
                ctx.lineTo(canvasW,i%canvasH);
                ctx.stroke();
            }
            
            // Отрисовка кирпичей (розовые)
            for(let b of bricks) {
                if(b.status === 1) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#ff69b4";
                    ctx.fillRect(b.x, b.y, b.w-1, b.h-1);
                    ctx.fillStyle = "#ff99cc";
                    ctx.fillRect(b.x+2, b.y+2, b.w-5, b.h-5);
                    ctx.fillStyle = "#ff3b6f";
                    ctx.fillRect(b.x+1, b.y+1, b.w-2, b.h-2);
                    // градиент
                    ctx.fillStyle = "#ffb6d9";
                    ctx.fillRect(b.x+3, b.y+3, b.w-7, b.h-7);
                }
            }
            
            // Бита (зеленая, светящаяся)
            ctx.shadowBlur = 6;
            ctx.shadowColor = "#8bc34a";
            ctx.fillStyle = "#6fda3c";
            ctx.fillRect(paddleX, paddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillStyle = "#a5f06a";
            ctx.fillRect(paddleX+4, paddleY-2, PADDLE_WIDTH-8, 5);
            ctx.fillStyle = "#3e9e1a";
            ctx.fillRect(paddleX+2, paddleY+2, PADDLE_WIDTH-4, 4);
            
            // Шарик (желтый с отблеском)
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ffcc33";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = "#ffdd77";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ball.x-2, ball.y-2, 3, 0, Math.PI*2);
            ctx.fillStyle = "#fff3b0";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ball.x+1.5, ball.y+1.5, 2, 0, Math.PI*2);
            ctx.fillStyle = "#ffc107";
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Отображение сообщений при окончании игры
            if(!gameRunning && lives <= 0) {
                ctx.font = "bold 36monospace";
                ctx.fillStyle = "#ffcc88";
                ctx.shadowBlur = 0;
                ctx.fillText("GAME OVER", canvasW/2-120, canvasH/2);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#ddd";
                ctx.fillText("Нажмите кнопку 'НОВАЯ ИГРА'", canvasW/2-145, canvasH/2+60);
            } else if(!gameRunning && lives>0) {
                // пауза не используется
            }
            
            // Тень биты и мелкие детали
            ctx.fillStyle = "#caff9e";
            ctx.fillRect(paddleX+5, paddleY-1, 20, 3);
        }
        
        // ---------- ЦИКЛ АНИМАЦИИ ----------
        function gameLoop() {
            updateGame();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // Сброс по кнопке
        function restartHandler() {
            cancelAnimationFrame(animationId);
            resetGame();
            gameRunning = true;
            // синхронизация важных параметров
            if(lives > 0) gameRunning = true;
            else gameRunning = true;
            lives = 3;
            score = 0;
            updateScoreUI();
            updateLivesUI();
            bricksSpeedY = 0.75;
            rowsToGenerate = 5;
            currentTopY = 45;
            initBricks();
            ball.dx = 2.8;
            ball.dy = -3.2;
            ball.x = canvasW/2;
            ball.y = paddleY - 14;
            paddleX = (canvasW - PADDLE_WIDTH)/2;
            document.getElementById('gameStatusText').innerHTML = "🎮 новая игра! двигай мышью";
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // Привязка событий и старт
        function bindEvents() {
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchstart', (e) => e.preventDefault());
            window.addEventListener('resize', () => {});
            document.getElementById('restartButton').addEventListener('click', () => {
                restartHandler();
            });
        }
        
        // Инициализация
        function startGame() {
            initBricks();
            bindEvents();
            gameRunning = true;
            animationId = requestAnimationFrame(gameLoop);
        }
        
        startGame();
    })();
</script>
</body>
